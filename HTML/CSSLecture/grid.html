<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
    <h1>Grid lessons</h1>

    <div class="gridOne">
        <div style="background-color: red;">1</div>
        <div style="background-color: yellow;">2</div>
        <div style="background-color: blue;">3</div>
        <div style="background-color: green;">4</div>
        <div style="background-color: purple;">5</div>
        <div style="background-color: pink;">6</div>
        <div style="background-color: aqua;">7</div>
        <div style="background-color: orange;">8</div>
        <div style="background-color: black;">9</div>
    </div>
    <br>

    <h1>Grid column add</h1>

    <div class="gridTwo">
        <div style="background-color: red;" class="columnadd">1</div>
        <div style="background-color: yellow;">2</div>
        <div style="background-color: blue;">3</div>
        <div style="background-color: green;">4</div>
        <div style="background-color: purple;">5</div>
        <div style="background-color: pink;">6</div>
        <div style="background-color: aqua;">7</div>
        <div style="background-color: orange;">8</div>
        <div style="background-color: black;">9</div>
    </div>
<br>
     <h1>Grid row add</h1>

    <div class="gridThree">
        <div style="background-color: red;">1</div>
        <div style="background-color: yellow;">2</div>
        <div style="background-color: blue;">3</div>
        <div style="background-color: green;">4</div>
        <div style="background-color: purple;" class="rowAdd">5</div>
        <div style="background-color: pink;">6</div>
        <div style="background-color: aqua;">7</div>
        <div style="background-color: orange;">8</div>
        <div style="background-color: black;">9</div>
    </div>
</body>
</html>
