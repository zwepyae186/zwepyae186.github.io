<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
    <h1>Focus</h1>

    <form id="mydata" method="get">
        <label for="name">Name</label>
        <input type="text" name="name" id="name">
        <br><br>

        <label for="">Gender</label>
        <br><br>

        <input type="radio" value="Male" id="male" name="gender">
        <label for="male">Male</label>
        <input type="radio" value="Female" id="female" name="gender">
        <label for="female">Female</label>
        <br><br>

        <label for="">Hobbies</label>
        <br>

        <div>
        <input type="checkbox" name="hobbies" value="Reading" id="reading">
        <label for="reading">Reading</label>
        </div>

        <div>
            <input type="checkbox" name="hobbies" value="Travelling" id="travelling">
        <label for="travelling">Travelling</label>
</div>

       <div> <input type="checkbox" name="hobbies" value="Swimming" id="swimming" disabled>
        <label for="swimming">Swimming</label>
        </div>

       <div> <input type="checkbox" name="hobbies" value="Dancing" id="dancing">
        <label for="dancing">Dancing</label>
        </div>

        <div>
            <label for="fName">Father Name</label>
            <input type="text" value="U Maung Nyo" id="fName" readonly>
        </div>
    </form>

</body>
</html>
