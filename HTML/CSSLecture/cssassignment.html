<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Assignment</title>

    <link rel="stylesheet" href="css/assigment.css">
</head>
<body class="back" style="background-color: #6979e3;">
    <div class="box">
    <h1 style="text-align: center;">
        Welcome Back!
    </h1>
    <p style="color: gray; text-align: center;" >
        Please login to your account
    </p>

    <form action="">
        <label for="email">Email Address</label>
        <br>
        <input type="text" id="email" name="email" placeholder="Enter your email" class="input">
        <br><br>

        <label for="password">Password</label>
        <br>
        <input type="text" name="password" id="password" placeholder="Enter your password" class="input">
        <br><br>

        <input type="checkbox" name="Remember" id="remember" value="Remember">
        <label for="remember">Remember me</label>

        <p class="forgot">
            <a href="" >Forgot Password?</a>
        </p>    
        <br><br>

        <button type="submit" class="login">Login</button>
    </form>
    <br>

    <div style="text-align: center;">
        <span style="color: gray;">Don't have an account?</span>
        <a href="">Sign Up</a>
    </div>
    </div>
</body>
</html>
