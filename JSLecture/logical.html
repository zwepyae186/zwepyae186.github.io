<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>logical</title>
</head> 
<body>
    <h1>Logical lesson</h1>
    <script>
        // OR operator ||

        let num1 = 10;
        let num2 = 20;
        let num3 = 30;

        console.log(num1 < num2 || num3 == num2 || num2 < num1);
        // true || false || false => true

        // AND Operator &&
        console.log(num1 < num2 && num3 == num2 && num2 > num1);
        // true && false && true => false

        // Not operator !
        let num4 = 40;
        console.log(!(num4 > num3) );
        
        
        
    </script>
</body>
</html>
